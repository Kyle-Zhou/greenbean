[project]
name = "greenbean"
version = "0.1.0"
description = "Agentic platform that keeps repository documentation continuously in sync with its code."
authors = [
    { name = "Kyle Zhou", email = "51883176+Kyle-Zhou@users.noreply.github.com" },
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "PyJWT[crypto]>=2.8",
]

[project.scripts]
greenbean = "greenbean.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
